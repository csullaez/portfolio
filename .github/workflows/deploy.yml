name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_SITE_NAME: ${{ secrets.PUBLIC_SITE_NAME }}
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
          PUBLIC_PERSONAL_NAME: ${{ secrets.PUBLIC_PERSONAL_NAME }}
          PUBLIC_PERSONAL_LAST_NAME: ${{ secrets.PUBLIC_PERSONAL_LAST_NAME }}
          PUBLIC_PERSONAL_ROLE: ${{ secrets.PUBLIC_PERSONAL_ROLE }}
          PUBLIC_PERSONAL_DESCRIPTION: ${{ secrets.PUBLIC_PERSONAL_DESCRIPTION }}
          PUBLIC_PERSONAL_EMAIL: ${{ secrets.PUBLIC_PERSONAL_EMAIL }}
          PUBLIC_PERSONAL_PHONE: ${{ secrets.PUBLIC_PERSONAL_PHONE }}
          PUBLIC_PERSONAL_LOCATION: ${{ secrets.PUBLIC_PERSONAL_LOCATION }}
          PUBLIC_PERSONAL_CV_URL: ${{ secrets.PUBLIC_PERSONAL_CV_URL }}
          PUBLIC_WEB3FORMS_KEY: ${{ secrets.PUBLIC_WEB3FORMS_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4